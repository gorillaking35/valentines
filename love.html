<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>💖 
</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      width: 400px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 16px;
      border-radius: 10px;
      border: 1px solid #ccc;
      resize: none;
    }

    button {
      font-size: 18px;
      padding: 10px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #ff4d6d;
      color: white;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Kirjuta oma sõnum:</h2>
    <textarea id="message">Kallis Bella,

Ma olen nii õnnelik, et meil on peaaegu aasta täis koos olnud – iga hetk sinuga on olnud eriline. Meie seiklus Roomas, varsti Norra ja Pariis… need kõik on vaid mälestused, mida ma igavesti kalliks pean.

Aga elu teeb huvitavaks see, et vahel peame ise otsuseid langetama. See, kuidas sa valikud teed, räägib palju sellest, mis on sinu jaoks tõeliselt oluline. Just sellest sõltub ka meie selle aasta Valentini päev – sellest, mis sinu elu põhiväärtused on.

Ma hindan sind ja meie teekonda nii väga. Ootan juba järgmisi seiklusi sinuga
</textarea>
    <br>
    <button onclick="goCards()">Armastan sind</button>
  </div>

  <script>
    function goCards() {
      // Võid salvestada teksti, kui vajad hiljem (pole kohustuslik cards.html jaoks)
      const msg = document.getElementById('message').value;
      sessionStorage.setItem('loveMessage', msg);

      // Suuname cards.html lehele
      window.location.href = "cards.html";
    }
  </script>

</body>
</html>
