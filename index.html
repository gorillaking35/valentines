<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <title>Valentiin 💌</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 30px;
    }

    button {
      font-size: 18px;
      padding: 10px 25px;
      margin: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .yes {
      background: #ff4d6d;
      color: white;
    }

    .no {
      background: #ccc;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Kas soovid olla minu valentiin? 💕</h1>
    <button class="yes" onclick="goNext()">Jah</button>
    <button class="no">Ei</button>
  </div>

  <script>
    function goNext() {
      window.location.href = "love.html"; // nüüd viib love.html lehele
    }
  </script>

</body>
</html>
